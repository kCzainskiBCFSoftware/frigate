name: Bump version

# Moves the version the release branch is working toward. Patch steps need no action:
# every stable release moves the Makefile from 0.17.5 to 0.17.6 on its own. Run this
# for a minor or major release, before releasing. See ra-docs/releasing.md.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'minor: 0.17.5 -> 0.18.0 | major: 0.17.5 -> 1.0.0 | patch: only if a release failed to bump'
        type: choice
        options:
          - minor
          - major
          - patch
        default: minor
        required: true

env:
  # Must match RELEASE_BRANCH in ci.yml.
  RELEASE_BRANCH: dev-fork

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      # Another branch's Makefile version would not reach a build that can be
      # released, and would conflict with the release branch on merge.
      - name: Guard - run on the release branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "${RELEASE_BRANCH}" ]; then
            echo "::error::Run this with 'Use workflow from' set to ${RELEASE_BRANCH}, not ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Check out the branch
        uses: actions/checkout@v6
        with:
          # Needed to check the version is not already tagged; the full history is not.
          fetch-tags: true
          fetch-depth: 1

      - name: Bump the Makefile
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          CURRENT=$(grep -m1 '^VERSION' Makefile | cut -d'=' -f2 | tr -d ' ')
          if ! [[ "${CURRENT}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Makefile VERSION is '${CURRENT}', not X.Y.Z"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "${CURRENT}"
          case "${BUMP}" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            *) echo "::error::Unknown bump '${BUMP}' (expected major, minor or patch)"; exit 1 ;;
          esac

          # Releasing a version twice would move the :${VERSION} image tag to different
          # bytes on devices that already pulled it.
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::v${VERSION} is already tagged, so ${BUMP} from ${CURRENT} has nowhere to go. Bump a larger step."
            exit 1
          fi

          sed -i "s/^VERSION = .*/VERSION = ${VERSION}/" Makefile
          if git diff --quiet -- Makefile; then
            echo "::error::Makefile was not changed — the VERSION line did not match"
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "CURRENT=${CURRENT}" >> "$GITHUB_ENV"
          git --no-pager diff -- Makefile

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump version to ${VERSION}" -- Makefile
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "BUMP_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      # A push made with GITHUB_TOKEN deliberately does not trigger other workflows, so
      # CI has to be asked for explicitly, or there would be no <version>-<sha> image to
      # test until the next merge.
      - name: Trigger CI for the bump commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"

      - name: Summary
        run: |
          {
            echo "### Bumped ${CURRENT} -> ${VERSION}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${BUMP_SHA}\` |"
            echo "| CI will publish | \`${VERSION}-${BUMP_SHA}\` |"
            echo ""
            echo "Test that image, then run **Release** from \`${GITHUB_REF_NAME}\`."
          } >> "$GITHUB_STEP_SUMMARY"
