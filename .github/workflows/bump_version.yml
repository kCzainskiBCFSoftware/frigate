name: Bump version

# The Makefile VERSION on the release branch is the version being worked toward: CI
# bakes it into every build as <version>-<sha>, and "Release" ships it, then moves it
# to the next patch version on its own. So this is only needed to jump further — a
# minor or major release (0.17.5 -> 0.18.0):
#
#   1. run this on the release branch with the new version
#   2. CI builds and publishes <version>-<sha> — test that image
#   3. run "Release" with that sha
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, e.g. 0.18.0 (no leading v)'
        required: true

env:
  # Must match RELEASE_BRANCH in ci.yml.
  RELEASE_BRANCH: dev-fork

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      # Another branch's Makefile version would not reach a build that can be
      # released, and would conflict with the release branch on merge.
      - name: Guard - run on the release branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "${RELEASE_BRANCH}" ]; then
            echo "::error::Run this on ${RELEASE_BRANCH}, not ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Check out the branch
        uses: actions/checkout@v6
        with:
          # Needed to check the version is not already tagged; the full history is not.
          fetch-tags: true
          fetch-depth: 1

      - name: Bump the Makefile
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${VERSION}' is not X.Y.Z (no leading v, no suffix)"
            exit 1
          fi

          CURRENT=$(grep -m1 '^VERSION' Makefile | cut -d'=' -f2 | tr -d ' ')
          if [ "${CURRENT}" = "${VERSION}" ]; then
            echo "::error::The Makefile on ${GITHUB_REF_NAME} already says ${VERSION}"
            exit 1
          fi
          # Going backwards would make builds claim a version older than one already
          # being worked toward, and could reuse a version number.
          if [ "$(printf '%s\n%s\n' "${CURRENT}" "${VERSION}" | sort -V | tail -1)" != "${VERSION}" ]; then
            echo "::error::${VERSION} is lower than the current ${CURRENT}"
            exit 1
          fi

          # Releasing a version twice would move the :${VERSION} image tag to different
          # bytes on devices that already pulled it.
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::v${VERSION} is already tagged — pick a new version"
            exit 1
          fi

          sed -i "s/^VERSION = .*/VERSION = ${VERSION}/" Makefile
          if git diff --quiet -- Makefile; then
            echo "::error::Makefile was not changed — the VERSION line did not match"
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "CURRENT=${CURRENT}" >> "$GITHUB_ENV"
          git --no-pager diff -- Makefile

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump version to ${VERSION}" -- Makefile
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "BUMP_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      # A push made with GITHUB_TOKEN deliberately does not trigger other workflows, so
      # CI has to be asked for explicitly, or there would be no <version>-<sha> image to
      # test until the next merge.
      - name: Trigger CI for the bump commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"

      - name: Summary
        run: |
          {
            echo "### Bumped ${CURRENT} -> ${VERSION}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${BUMP_SHA}\` |"
            echo "| CI will publish | \`${VERSION}-${BUMP_SHA}\` |"
            echo ""
            echo "Test that image, then run **Release** with sha \`${BUMP_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
