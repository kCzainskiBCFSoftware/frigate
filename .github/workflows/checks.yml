  web_checks:
    name: Web - Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: ./web
      - name: Lint
        run: npm run lint
        working-directory: ./web
      - name: Build web
        run: npm run build
        working-directory: ./web
