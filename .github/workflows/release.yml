name: Release

# Ships a build of the release branch. The runbook — the steps, how the next version is
# chosen, and how to do a minor or major release — is ra-docs/releasing.md.
#
# Two ways in, same result:
#
#   - Actions -> Release -> Run workflow, with "Use workflow from" on dev-fork. Releases
#     the tip of dev-fork as the version its Makefile names, and creates the tag and the
#     GitHub release. Picking a v* tag there instead releases that tag.
#   - Publish a GitHub release with a new v<version> tag targeting dev-fork. Publishing
#     creates the tag, which runs this; the release you wrote is kept as it is.
#
# Either way, the image CI built for that commit gets one layer that rewrites
# frigate/version.py to the bare version, and is pushed as :<version> (plus :stable for
# the newest stable release). Then the Makefile on dev-fork moves to the next patch
# version, so later builds report the version being worked toward.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Two releases at once would race on the tag and on the Makefile bump.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Must match RELEASE_BRANCH in ci.yml.
  RELEASE_BRANCH: dev-fork

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Check out the release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 1

      # From the release branch, the Makefile names the version and the tag is created
      # here. From a tag (pushed, published as a GitHub release, or picked in "Use
      # workflow from"), the tag names the version and the Makefile has to agree.
      - name: Resolve the commit and version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            CREATE_TAG=false
            if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::'${TAG}' is not a version tag (expected vX.Y.Z or vX.Y.Z-suffix)"
              exit 1
            fi
          elif [ "${GITHUB_REF_NAME}" = "${RELEASE_BRANCH}" ]; then
            CREATE_TAG=true
          else
            echo "::error::Run this with 'Use workflow from' set to ${RELEASE_BRANCH} or a v* tag, not ${GITHUB_REF_NAME}."
            exit 1
          fi

          # A tag is resolved to its commit here rather than taken from GITHUB_SHA, so an
          # annotated tag pushed from git behaves like one GitHub created.
          if [ "${CREATE_TAG}" = false ]; then
            git fetch --no-tags --depth 1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
            FULL_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
          else
            FULL_SHA="${GITHUB_SHA}"
            git fetch --no-tags --depth 1 origin "${FULL_SHA}"
          fi
          MAKEFILE_VERSION=$(git show "${FULL_SHA}:Makefile" | grep -m1 '^VERSION' | cut -d'=' -f2 | tr -d ' ')
          if ! [[ "${MAKEFILE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Makefile at ${FULL_SHA::7} has VERSION = '${MAKEFILE_VERSION}', not X.Y.Z"
            exit 1
          fi

          if [ "${CREATE_TAG}" = true ]; then
            TAG="v${MAKEFILE_VERSION}"
          fi
          VERSION="${TAG#v}"
          # A pre-release tag like v0.18.0-beta1 is built from the 0.18.0 source, so the
          # Makefile is checked against the base while the image gets the full tag.
          BASE_VERSION="${VERSION%%-*}"
          BUILD_TYPE=$([[ "${VERSION}" == *-* ]] && echo beta || echo stable)

          if [ "${MAKEFILE_VERSION}" != "${BASE_VERSION}" ]; then
            echo "::error::Tag ${TAG} is on a commit whose Makefile says VERSION = ${MAKEFILE_VERSION}, not ${BASE_VERSION}. Delete the tag (and its GitHub release, if you published one) and release v${MAKEFILE_VERSION} instead."
            exit 1
          fi

          # Only the newest stable release takes :stable and "Latest" — re-running an older
          # release must not move them back. PREVIOUS is where its release notes start.
          STABLE_TAGS=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          NEWEST=$({ echo "${STABLE_TAGS}"; echo "${TAG}"; } | grep . | sort -uV | tail -1)
          PREVIOUS=$({ echo "${STABLE_TAGS}"; echo "${TAG}"; } | grep . | sort -uV | grep -Fx -B1 -- "${TAG}" | head -1)
          [ "${PREVIOUS}" = "${TAG}" ] && PREVIOUS=""
          IS_NEWEST=$([ "${BUILD_TYPE}" = stable ] && [ "${NEWEST}" = "${TAG}" ] && echo true || echo false)

          {
            echo "TAG=${TAG}"
            echo "VERSION=${VERSION}"
            echo "BASE_VERSION=${BASE_VERSION}"
            echo "BUILD_TYPE=${BUILD_TYPE}"
            echo "CREATE_TAG=${CREATE_TAG}"
            echo "IS_NEWEST=${IS_NEWEST}"
            echo "PREVIOUS_TAG=${PREVIOUS}"
            echo "FULL_SHA=${FULL_SHA}"
            # The image tags use ${GITHUB_SHA::7}; git's own abbreviation is 8 chars here.
            echo "BUILD_TAG=sha-${FULL_SHA::7}"
            echo "REGISTRY=${{ secrets.ECR_REGISTRY }}"
            echo "REPOSITORY=${{ vars.ECR_REPOSITORY }}"
          } >> "$GITHUB_ENV"
          echo "Releasing ${FULL_SHA::7} as ${VERSION} (newest stable: ${IS_NEWEST}, notes from: ${PREVIOUS:-the start})"

      # Releases come from the baseline: a feature-branch build is not what gets merged,
      # and the version bump below would land on code that never contained it.
      - name: Guard - the commit must be on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${FULL_SHA}...${RELEASE_BRANCH}" --jq .status)
          case "${STATUS}" in
            ahead|identical) echo "${FULL_SHA::7} is on ${RELEASE_BRANCH}" ;;
            *)
              echo "::error::${FULL_SHA::7} is not on ${RELEASE_BRANCH} (compare status: ${STATUS}). Tag a commit that is on ${RELEASE_BRANCH}."
              exit 1
              ;;
          esac

      # Only a run from the release branch creates the tag, so only it can collide with one.
      - name: Guard - the version must not be released already
        if: env.CREATE_TAG == 'true'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} is already released, but the Makefile on ${RELEASE_BRANCH} still says ${VERSION}. If that release failed partway, finish it by running Release from the ${TAG} tag; otherwise run 'Bump version' with patch."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify the source image exists
        run: |
          if ! aws ecr describe-images \
                --repository-name "${REPOSITORY}" \
                --image-ids imageTag="${BUILD_TAG}" >/dev/null 2>&1; then
            echo "::error::No image tagged ${BUILD_TAG} in ${REPOSITORY}. That commit was never built by CI — wait for CI on ${RELEASE_BRANCH} to finish, then re-run."
            exit 1
          fi

      # The image goes out before the tag, so a failure here leaves no tag behind and
      # the run can simply be re-run.
      - name: Stamp the release version and push
        run: |
          SOURCE="${REGISTRY}/${REPOSITORY}:${BUILD_TAG}"
          TAGS=(--tag "${REGISTRY}/${REPOSITORY}:${VERSION}")
          if [ "${IS_NEWEST}" = true ]; then
            TAGS+=(--tag "${REGISTRY}/${REPOSITORY}:stable")
          fi

          # Empty context: the Dockerfile comes from the checkout via --file and needs
          # nothing else, so there is no reason to upload the repo to the builder.
          mkdir -p /tmp/empty-context

          # provenance=false keeps this a plain single-platform manifest, matching what
          # CI pushes; an attestation index confuses the Docker on the QNAP.
          docker buildx build \
            --file docker/release/version-stamp.Dockerfile \
            --build-arg SOURCE="${SOURCE}" \
            --build-arg RELEASE_VERSION="${VERSION}" \
            --build-arg BASE_VERSION="${BASE_VERSION}" \
            "${TAGS[@]}" \
            --provenance=false \
            --push \
            /tmp/empty-context

      # A tag pushed with GITHUB_TOKEN does not trigger workflows, so this does not
      # start a second release.
      - name: Create the release tag
        if: env.CREATE_TAG == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${VERSION}" "${FULL_SHA}"
          git push origin "refs/tags/${TAG}"

      # A GitHub release published by hand is what started this run, so it is kept. The
      # notes are cosmetic: if GitHub cannot generate them, the release links the
      # changelog instead of failing a release whose image and tag are already out.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists; left as it is"
            exit 0
          fi

          NOTES_ARGS=(-f tag_name="${TAG}" -f target_commitish="${FULL_SHA}")
          [ -n "${PREVIOUS_TAG}" ] && NOTES_ARGS+=(-f previous_tag_name="${PREVIOUS_TAG}")
          if ! GENERATED=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${NOTES_ARGS[@]}" --jq .body); then
            echo "::warning::GitHub could not generate release notes; the release links the changelog instead"
            GENERATED="**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
            [ -n "${PREVIOUS_TAG}" ] && GENERATED="**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
          fi

          {
            if [ "${IS_NEWEST}" = true ]; then
              echo "Image: \`${REPOSITORY}:${VERSION}\` (also \`${REPOSITORY}:stable\`)"
            else
              echo "Image: \`${REPOSITORY}:${VERSION}\`"
            fi
            echo ""
            echo "${GENERATED}"
          } > "${RUNNER_TEMP}/release-notes.md"

          ARGS=(--title "${TAG}" --notes-file "${RUNNER_TEMP}/release-notes.md" --verify-tag)
          if [ "${BUILD_TYPE}" = beta ]; then
            ARGS+=(--prerelease --latest=false)
          elif [ "${IS_NEWEST}" = true ]; then
            ARGS+=(--latest)
          else
            ARGS+=(--latest=false)
          fi
          gh release create "${TAG}" "${ARGS[@]}"

      # Pre-releases are steps toward the same version, so only a stable release moves
      # it on. If the Makefile has already moved past the release (someone ran "Bump
      # version"), it is left alone. CI is not triggered for the bump commit: it would
      # only rebuild the released code, and the next merge builds anyway.
      - name: Move the release branch to the next version
        if: env.BUILD_TYPE == 'stable'
        run: |
          IFS=. read -r MAJOR MINOR PATCH <<< "${BASE_VERSION}"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retry in case a merge lands on the release branch while this runs.
          for attempt in 1 2 3; do
            git fetch --no-tags --depth 1 origin "${RELEASE_BRANCH}"
            git checkout -q -B "${RELEASE_BRANCH}" FETCH_HEAD
            CURRENT=$(grep -m1 '^VERSION' Makefile | cut -d'=' -f2 | tr -d ' ')
            if [ "${CURRENT}" != "${BASE_VERSION}" ]; then
              echo "::notice::Makefile on ${RELEASE_BRANCH} already says ${CURRENT}, not ${BASE_VERSION}; left as is"
              echo "NEXT_VERSION=${CURRENT}" >> "$GITHUB_ENV"
              exit 0
            fi
            sed -i "s/^VERSION = .*/VERSION = ${NEXT}/" Makefile
            git commit -q -m "Bump version to ${NEXT} after releasing ${TAG}" -- Makefile
            if git push origin "HEAD:${RELEASE_BRANCH}"; then
              echo "NEXT_VERSION=${NEXT}" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Push lost a race with another change to ${RELEASE_BRANCH}, retrying (${attempt}/3)"
          done
          echo "::error::Released ${TAG}, but could not push the bump to ${NEXT}. Run 'Bump version' with patch."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release ${VERSION:-?}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${FULL_SHA::7}\` |"
            echo "| Tag | \`${TAG:-?}\` |"
            echo "| Image | \`${REPOSITORY:-?}:${VERSION:-?}\`$([ "${IS_NEWEST:-}" = true ] && echo ' + `stable`') |"
            echo "| Instances report | \`${VERSION:-?}\` |"
            echo "| GitHub release | https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG:-} |"
            echo "| ${RELEASE_BRANCH} now builds | \`${NEXT_VERSION:-unchanged}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
