name: On release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Create tag variables
        env:
          TAG: ${{ github.ref_name }}
        run: |
          BUILD_TYPE=$([[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && echo "stable" || echo "beta")
          echo "BUILD_TYPE=${BUILD_TYPE}" >> $GITHUB_ENV
          echo "REGISTRY=${{ secrets.ECR_REGISTRY }}" >> $GITHUB_ENV
          echo "REPOSITORY=${{ secrets.ECR_REPOSITORY }}" >> $GITHUB_ENV
          echo "BUILD_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "CLEAN_VERSION=$(echo ${GITHUB_REF##*/} | tr '[:upper:]' '[:lower:]' | sed 's/^[v]//')" >> $GITHUB_ENV
      - name: Tag and push versioned image
        run: |
          SOURCE=${REGISTRY}/${REPOSITORY}:${BUILD_TAG}
          VERSION_TAG=${REGISTRY}/${REPOSITORY}:${CLEAN_VERSION}

          docker pull ${SOURCE}
          docker tag ${SOURCE} ${VERSION_TAG}
          docker push ${VERSION_TAG}

          if [[ "${BUILD_TYPE}" == "stable" ]]; then
            STABLE_TAG=${REGISTRY}/${REPOSITORY}:stable
            docker tag ${SOURCE} ${STABLE_TAG}
            docker push ${STABLE_TAG}
          fi
