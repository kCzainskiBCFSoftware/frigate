name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - v17.1-update-with-adaptive
    paths-ignore:
      - "docs/**"

# only run the latest commit to avoid cache overwrites
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  amd64_build:
    runs-on: ubuntu-22.04
    name: AMD64 Build
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Buildx and authenticate to ECR
        id: setup
        uses: ./.github/actions/setup
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          ecr-registry: ${{ secrets.ECR_REGISTRY }}
          ecr-repository: ${{ secrets.ECR_REPOSITORY }}
      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/main/Dockerfile
          push: true
          platforms: linux/amd64
          target: frigate
          tags: |
            ${{ steps.setup.outputs.image-name }}
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ steps.setup.outputs.cache-name }}
          cache-to: type=registry,ref=${{ steps.setup.outputs.cache-name }},mode=max
